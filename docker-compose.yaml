version: '3'
services:

  # Prometheus for metrics storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - otel-collector
    networks:
      - elastic
      
  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - elastic

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: otel-collector
    restart: always
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # Health check extension
      - "55678:55678" # OpenCensus receiver
      - "55679:55679" # zpages extension
    depends_on:
      - loki
      - tempo
    networks:
      - elastic

  # Banking Services
  # Customer API (Cloud Environment)
  customer-api:
    image: node:20
    container_name: customer-api
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: bash -c "cd /app && npm install && node customer-api/server.js"
    ports:
      - "3000:3000"
    depends_on:
      - otel-collector
    networks:
      - elastic
    environment:
      - NODE_ENV=development

  # Customer Service (Cloud Environment)
  customer-service:
    image: node:20
    container_name: customer-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: bash -c "cd /app && npm install && node customer-service/server.js"
    ports:
      - "3003:3003"
    depends_on:
      - otel-collector
    networks:
      - elastic
    environment:
      - NODE_ENV=development
      - ACCOUNT_SERVICE_URL=http://account-service:3002

  # Account Service (Hybrid Environment)
  account-service:
    image: node:20
    container_name: account-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: bash -c "cd /app && npm install && node account-service/server.js"
    ports:
      - "3002:3002"
    depends_on:
      - otel-collector
      - customer-service
    networks:
      - elastic
    environment:
      - NODE_ENV=development
      - CUSTOMER_SERVICE_URL=http://customer-service:3003
      - LOAN_SERVICE_URL=http://loan-service:3008

  # Transaction Service (On-Premises Environment)
  transaction-service:
    image: node:20
    container_name: transaction-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: bash -c "cd /app && npm install && node transaction-service/server.js"
    ports:
      - "3004:3004"
    depends_on:
      - otel-collector
      - account-service
    networks:
      - elastic
    environment:
      - NODE_ENV=development
      - ACCOUNT_SERVICE_URL=http://account-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3006
      - AUDIT_SERVICE_URL=http://audit-service:3009
      - ANALYTICS_SERVICE_URL=http://analytics-service:3010
    
  notification-service:
    image: node:20
    container_name: notification-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node notification-service/server.js"
    ports:
      - "3006:3006"
    depends_on:
      - otel-collector
    networks:
      - elastic
  
  fraud-service:
    image: node:20
    container_name: fraud-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node fraud-service/server.js"
    ports:
      - "3007:3007"
    depends_on:
      - otel-collector
    networks:
      - elastic
  
  loan-service:
    image: node:20
    container_name: loan-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node loan-service/server.js"
    ports:
      - "3008:3008"
    depends_on:
      - otel-collector
      - fraud-service
    environment:
      - FRAUD_SERVICE_URL=http://fraud-service:3007
    networks:
      - elastic
  
  audit-service:
    image: node:20
    container_name: audit-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node audit-service/server.js"
    ports:
      - "3009:3009"
    depends_on:
      - otel-collector
    networks:
      - elastic
    
  analytics-service:
    image: node:20
    container_name: analytics-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node analytics-service/server.js"
    ports:
      - "3010:3010"
    depends_on:
      - otel-collector
    networks:
      - elastic
  
  report-service:
    image: node:20
    container_name: report-service
    working_dir: /app
    volumes:
      - ./banking-services:/app
    command: >
      bash -c "cd /app &&
      npm install &&
      node report-service/server.js"
    ports:
      - "3011:3011"
    depends_on:
      - analytics-service
      - otel-collector
    environment:
      - ANALYTICS_SERVICE_URL=http://analytics-service:3010
    networks:
      - elastic
      
  # Load-tester service
  load-tester:
    image: node:20
    container_name: load-tester
    working_dir: /app
    volumes:
      - .:/app
    command: bash -c "npm install && node load-tester.js"
    depends_on:
      - customer-api
      - customer-service
      - account-service
      - transaction-service
    networks:
      - elastic
    environment:
      - CUSTOMER_API_URL=http://customer-api:3000
      - ACCOUNT_SERVICE_URL=http://account-service:3002
      - TRANSACTION_SERVICE_URL=http://transaction-service:3004
    # Start this manually when needed:
    # docker-compose up load-tester
    profiles:
      - tools

  # Loki for log storage
  loki:
    image: grafana/loki:3.4.3
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - elastic

  # Tempo for trace storage
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml
    ports:
      - "3200:3200"  # tempo
    networks:
      - elastic
  
  rca-service:
    build: ./rca-service
    container_name: rca-service
    ports:
      - "4000:4000"
    depends_on:
      - prometheus
      - loki
    networks:
      - elastic
    extra_hosts:
    - "host.docker.internal:host-gateway"
  prediction-service:
    build: ./prediction-service
    container_name: prediction-service
    depends_on:
      - prometheus
    restart: always
    env_file:
      - ./rca-service/.env
    networks:
      - elastic  


  
  alertmanager:
    image: prom/alertmanager
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - elastic

  dashboard:
    build: ./dashboard
    container_name: dashboard-ui
    ports:
      - "8080:80"
    depends_on:
      - grafana
      - rca-service
      - prediction-service
    networks:
      - elastic


volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

networks:
  elastic:
    driver: bridge 