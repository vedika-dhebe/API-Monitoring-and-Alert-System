groups:
  - name: api-alerts
    rules:
    
      - alert: CustomerAPIServiceMissing
        expr: absent(bank_http_client_duration_milliseconds_count{service_name="customer-api-service"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Customer API Service metrics missing"

      - alert: ServiceNoTraffic
        expr: |
          (
            sum by (service_name) (
              rate(bank_http_client_duration_milliseconds_count[1m])
            )
          ) == 0
          or
          absent(bank_http_client_duration_milliseconds_count)

        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service_name }} not receiving traffic"

      - alert: HighErrorRate
        expr: |
          sum by (exported_job)(
            rate(bank_http_client_duration_milliseconds_count{http_status_code=~"5.."}[5m])
          ) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Service {{ $labels.exported_job }} is returning too many 5xx errors"
      
      - alert: HighErrorRate4xx
        expr: |
          sum by (exported_job)(
            rate(bank_http_client_duration_milliseconds_count{http_status_code=~"4.."}[5m])
          ) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Service {{ $labels.exported_job }} is returning too many 4xx errors"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, exported_job)(
              rate(bank_http_client_duration_milliseconds_bucket[5m])
            )
          ) > 800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected"
          description: "P95 latency is too high for {{ $labels.exported_job }}"

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service is down"
          description: "Prometheus target {{ $labels.instance }} is down"
