global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 5s
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090'] 
      
  - job_name: 'docker-services'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

  - job_name: 'analytics-service'
    static_configs:
      - targets: ['analytics-service:3010']

  - job_name: 'audit-service'
    static_configs:
      - targets: ['audit-service:3009']

  - job_name: 'fraud-service'
    static_configs:
      - targets: ['fraud-service:3007']

  - job_name: 'loan-service'
    static_configs:
      - targets: ['loan-service:3008']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['notification-service:3006']

  - job_name: 'report-service'
    static_configs:
      - targets: ['report-service:3011']